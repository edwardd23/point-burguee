name: Publicar Point Burguer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos e URLs públicas de SEO
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 preparar-publicacao.py
      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
